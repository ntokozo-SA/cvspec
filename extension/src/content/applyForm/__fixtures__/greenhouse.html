<div id="app">
  <h1>Senior Engineer</h1>
  <form id="application-form" class="application--form" action="/acme/jobs/123/applications" method="post">
    <div class="field-wrapper">
      <label for="first_name" id="first_name-label">First Name<span>*</span></label>
      <input id="first_name" type="text" aria-required="true" required autocomplete="given-name" />
    </div>
    <div class="field-wrapper">
      <label for="last_name">Last Name<span>*</span></label>
      <input id="last_name" type="text" aria-required="true" required />
    </div>
    <div class="field-wrapper">
      <label for="preferred_name">Preferred First Name</label>
      <input id="preferred_name" type="text" />
    </div>
    <div class="field-wrapper">
      <label for="email">Email<span>*</span></label>
      <input id="email" type="text" aria-required="true" required />
    </div>
    <div class="field-wrapper">
      <label for="phone">Phone</label>
      <input id="phone" type="tel" />
    </div>
    <div class="field-wrapper">
      <label for="candidate-location">Location (City)</label>
      <input id="candidate-location" type="text" role="combobox" aria-autocomplete="list" />
    </div>
    <div class="file-upload">
      <div id="upload-label-resume">Resume/CV<span>*</span></div>
      <button type="button">Attach</button>
      <input
        id="resume"
        type="file"
        accept=".pdf,.doc,.docx,.txt,.rtf"
        aria-labelledby="upload-label-resume"
        required
        style="display: none"
      />
    </div>
    <div class="file-upload">
      <div id="upload-label-cover_letter">Cover Letter</div>
      <button type="button">Attach</button>
      <input
        id="cover_letter"
        type="file"
        aria-labelledby="upload-label-cover_letter"
        style="display: none"
      />
    </div>
    <div class="field-wrapper">
      <label for="question_1">LinkedIn Profile</label>
      <input id="question_1" type="text" />
    </div>
    <div class="field-wrapper">
      <label for="question_2">Website</label>
      <input id="question_2" type="text" />
    </div>
    <div class="field-wrapper">
      <label for="question_3">Are you legally authorized to work in the United States?<span>*</span></label>
      <select id="question_3" required>
        <option value=""></option>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </div>
    <button type="submit">Submit application</button>
  </form>
</div>
