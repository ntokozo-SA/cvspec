<div data-automation-id="applyFlowPage">
  <div data-automation-id="signInContent">
    <h2>Sign In</h2>
    <form>
      <div data-automation-id="formField-email">
        <label for="wd-email">Email Address</label>
        <input id="wd-email" type="text" data-automation-id="email" />
      </div>
      <div data-automation-id="formField-password">
        <label for="wd-password">Password</label>
        <input id="wd-password" type="password" data-automation-id="password" />
      </div>
      <button type="button" data-automation-id="signInSubmitButton">Sign In</button>
    </form>
    <button type="button" data-automation-id="createAccountLink">Create Account</button>
  </div>
</div>
