<div id="careerSite">
  <h1>Apply: Graduate Programme - Nedbank</h1>
  <form id="careerForm" name="careerForm" novalidate>
    <div class="sapMInputBase">
      <label id="__label0" for="__input0-inner">First Name *</label>
      <input id="__input0-inner" type="text" aria-required="true" />
    </div>
    <div class="sapMInputBase">
      <label id="__label1" for="__input1-inner">Last Name *</label>
      <input id="__input1-inner" type="text" aria-required="true" />
    </div>
    <div class="sapMInputBase">
      <label id="__label2" for="__input2-inner">Email Address *</label>
      <input id="__input2-inner" type="text" aria-required="true" />
    </div>
    <div class="sapMInputBase">
      <label id="__label3" for="__input3-inner">Confirm Email Address *</label>
      <input id="__input3-inner" type="text" aria-required="true" />
    </div>
    <div class="sapMInputBase">
      <label id="__label4" for="__input4-inner">Cell Phone</label>
      <input id="__input4-inner" type="text" />
    </div>
    <div class="sapMInputBase">
      <label id="__label5" for="__input5-inner">City</label>
      <input id="__input5-inner" type="text" />
    </div>
    <div class="sapMInputBase">
      <label id="__label6" for="__input6-inner">South African ID Number *</label>
      <input id="__input6-inner" type="text" aria-required="true" />
    </div>
    <div class="sapMInputBase">
      <label id="__label7" for="__select0">Highest Qualification *</label>
      <select id="__select0" aria-required="true">
        <option value="">Please select</option>
        <option value="matric">Matric</option>
        <option value="diploma">Diploma</option>
        <option value="degree">Degree</option>
      </select>
    </div>
    <div class="sapMInputBase">
      <label id="__label8" for="__select1">Race</label>
      <select id="__select1">
        <option value="">Please select</option>
        <option value="a">African</option>
        <option value="c">Coloured</option>
        <option value="i">Indian</option>
        <option value="w">White</option>
      </select>
    </div>
    <div class="attachment">
      <label for="resumeUpload">Resume *</label>
      <input id="resumeUpload" type="file" accept=".pdf,.doc,.docx" />
    </div>
    <div class="sapMInputBase">
      <label id="__label9" for="__area0-inner">Cover Letter</label>
      <textarea id="__area0-inner"></textarea>
    </div>
    <button type="button" id="__button0">Apply</button>
  </form>
</div>
