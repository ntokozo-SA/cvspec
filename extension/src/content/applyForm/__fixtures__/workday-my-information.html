<div data-automation-id="applyFlowPage">
  <ol data-automation-id="progressBar">
    <li data-automation-id="progressBarActiveStep">
      <div>current step 1 of 6</div>
      <label>My Information</label>
    </li>
    <li data-automation-id="progressBarInactiveStep"><label>My Experience</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>Application Questions</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>Voluntary Disclosures</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>Self Identify</label></li>
    <li data-automation-id="progressBarInactiveStep"><label>Review</label></li>
  </ol>
  <div data-automation-id="applyFlowMyInfoPage">
    <h2>My Information</h2>
    <div data-automation-id="formField-countryDropdown">
      <label for="input-1">Country<abbr title="required">*</abbr></label>
      <button
        type="button"
        id="input-1"
        aria-haspopup="listbox"
        aria-controls="popup-country"
        data-automation-id="countryDropdown"
      >
        South Africa
      </button>
    </div>
    <div data-automation-id="formField-previousWorker">
      <fieldset>
        <legend>Have you previously worked for Absa?<abbr title="required">*</abbr></legend>
        <label><input type="radio" name="previousWorker" value="true" /> Yes</label>
        <label><input type="radio" name="previousWorker" value="false" /> No</label>
      </fieldset>
    </div>
    <div data-automation-id="formField-legalNameSection_firstName">
      <label for="input-4">Given Name(s)<abbr title="required">*</abbr></label>
      <input
        id="input-4"
        type="text"
        data-automation-id="legalNameSection_firstName"
        aria-required="true"
      />
    </div>
    <div data-automation-id="formField-legalNameSection_lastName">
      <label for="input-5">Family Name<abbr title="required">*</abbr></label>
      <input
        id="input-5"
        type="text"
        data-automation-id="legalNameSection_lastName"
        aria-required="true"
      />
    </div>
    <div data-automation-id="formField-addressSection_city">
      <label for="input-8">City</label>
      <input id="input-8" type="text" data-automation-id="addressSection_city" />
    </div>
    <div data-automation-id="formField-email">
      <label for="input-10">Email Address</label>
      <input id="input-10" type="text" data-automation-id="email" />
    </div>
    <div data-automation-id="formField-phoneType">
      <label for="input-11">Phone Device Type<abbr title="required">*</abbr></label>
      <button
        type="button"
        id="input-11"
        aria-haspopup="listbox"
        aria-controls="popup-phone-type"
        data-automation-id="phone-device-type"
      >
        Select One
      </button>
    </div>
    <div data-automation-id="formField-phoneNumber">
      <label for="input-13">Phone Number<abbr title="required">*</abbr></label>
      <input id="input-13" type="text" data-automation-id="phone-number" aria-required="true" />
    </div>
  </div>
  <div role="listbox" id="popup-country" hidden>
    <div role="option">Botswana</div>
    <div role="option">South Africa</div>
  </div>
  <div role="listbox" id="popup-phone-type" hidden>
    <div role="option">Mobile</div>
    <div role="option">Home</div>
  </div>
  <div data-automation-id="bottom-navigation">
    <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
  </div>
</div>
